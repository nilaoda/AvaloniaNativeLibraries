name: Build Windows
run-name: ${{ github.workflow }} ${{ inputs.architecture }} (${{ inputs.component }})

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: Target architecture
        type: choice
        default: x64
        options: [x64, arm64]
      component:
        description: Component to build and verify
        type: choice
        default: all
        options: [all, skia, harfbuzz, angle]

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}-${{ inputs.architecture }}-${{ inputs.component }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ${{ inputs.architecture == 'arm64' && 'windows-11-arm' || 'windows-2022' }}
    timeout-minutes: 180
    env:
      RID: win-${{ inputs.architecture }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore native build cache
        uses: actions/cache/restore@v4
        with:
          path: .build/${{ env.RID }}
          key: native-v2-${{ env.RID }}-${{ hashFiles('config/versions.json') }}-${{ inputs.component }}-${{ github.run_id }}
          restore-keys: native-v2-${{ env.RID }}-${{ hashFiles('config/versions.json') }}-${{ inputs.component }}-
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ inputs.architecture }}
      - name: Install pinned LLVM
        if: inputs.component == 'all' || inputs.component == 'skia'
        shell: pwsh
        run: ./scripts/setup-windows.ps1
      - name: Install Ninja
        run: python -m pip install ninja==1.13.0
      - name: Check build configuration
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Build and verify static libraries
        env:
          COMPONENT: ${{ inputs.component }}
        shell: pwsh
        run: |
          python scripts/build.py --rid "$env:RID" --component "$env:COMPONENT"
          if ($LASTEXITCODE -ne 0) { throw 'Windows native build or verification failed.' }
      - name: Upload Windows libraries
        uses: actions/upload-artifact@v4
        with:
          name: avalonia-native-${{ env.RID }}-${{ inputs.component }}
          path: artifacts/avalonia-native-${{ env.RID }}-${{ inputs.component }}.zip
          if-no-files-found: error
          retention-days: 7
      - name: Save native build cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: .build/${{ env.RID }}
          key: native-v2-${{ env.RID }}-${{ hashFiles('config/versions.json') }}-${{ inputs.component }}-${{ github.run_id }}
